<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 职场文档提效课 · 宣传海报</title><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#dad8d1;font-family:Arial,"Noto Sans SC",sans-serif;color:#11162d}.poster{width:1242px;height:1660px;margin:30px auto;background:#f7f5ef;border:6px solid #11162d;position:relative;overflow:hidden;padding:78px}.shape{position:absolute;border:5px solid #11162d}.s1{width:440px;height:440px;background:#6d5ef7;right:-150px;top:-160px;transform:rotate(15deg)}.s2{width:280px;height:280px;background:#6ee7b7;right:40px;bottom:-120px;transform:rotate(-10deg)}.eyebrow{display:inline-block;background:#ffdf6c;border:4px solid #11162d;box-shadow:8px 8px 0 #11162d;padding:13px 24px;font-size:24px;font-weight:900;letter-spacing:4px;position:relative}.poster h1{font-size:108px;line-height:.95;letter-spacing:-6px;margin:78px 0 34px;max-width:900px;position:relative}.sub{font-size:35px;line-height:1.45;max-width:940px;color:#3e4355;font-weight:700}.route{margin:70px 0 54px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative}.route span{background:#fff;border:4px solid #11162d;box-shadow:8px 8px 0 #11162d;padding:25px 18px;text-align:center;font-size:25px;font-weight:900}.route span:nth-child(2){background:#e9e7ff}.route span:nth-child(5){background:#fff4ce}.promise{background:#11162d;color:#fff;padding:34px 38px;font-size:32px;line-height:1.5;font-weight:800;border:5px solid #000;box-shadow:12px 12px 0 #ff6b57;position:relative}.meta{display:flex;gap:18px;margin-top:55px;position:relative}.meta div{border:4px solid #11162d;padding:18px 24px;background:#fff;font-size:25px;font-weight:900}.footer{position:absolute;left:78px;bottom:70px;font-size:23px;font-weight:900;letter-spacing:2px}.download{position:fixed;right:24px;bottom:24px;border:3px solid #000;background:#11162d;color:#fff;padding:14px 20px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:5px 5px 0 #6d5ef7}@media(max-width:1300px){.poster{transform-origin:top left;transform:scale(.65);margin-bottom:-560px}}@media(max-width:850px){.poster{transform:scale(.3);margin-bottom:-1130px}}@media print{.download{display:none}.poster{margin:0;transform:none}}</style></head><body><div id="poster" class="poster"><div class="shape s1"></div><div class="shape s2"></div><div class="eyebrow">LIVE WORKSHOP · 90–120 MIN</div><h1>AI 职场文档<br>提效课</h1><div class="sub">老师现场带你把一份杂乱会议记录，变成一套团队可以直接执行的工作文档。</div><div class="route"><span>会议纪要</span><span>决策事项</span><span>负责人 × 截止日期</span><span>工作日报</span><span>项目周报</span><span>工作总结</span></div><div class="promise">带一份原始记录来，带一套可直接使用的会议纪要、日报、周报和工作总结模板走。</div><div class="meta"><div>行政 · 销售 · 市场</div><div>项目人员 · 管理者</div><div>零技术门槛</div></div><div class="footer">JIANGREN ACADEMY · 实操为主 · 学完即用</div></div><button class="download" onclick="savePoster()">⬇ 下载 PNG</button><script>function savePoster(){const p=document.getElementById('poster');html2canvas(p,{scale:1,useCORS:true,backgroundColor:'#f7f5ef'}).then(c=>{const a=document.createElement('a');a.download='ai-workplace-docs-workshop-poster.png';a.href=c.toDataURL('image/png');a.click()})}</script></body></html>
