<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;900&family=DM+Sans:wght@500;700&family=Space+Mono:wght@700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans','Noto Sans SC',sans-serif;background:#e8e6df;padding:30px;display:flex;flex-direction:column;align-items:center;gap:18px;}
  #poster{width:900px;height:1200px;background:#FFDE59;border:5px solid #10162f;padding:64px 56px;display:flex;flex-direction:column;position:relative;}
  .kicker{font-family:'Space Mono',monospace;font-weight:700;font-size:20px;letter-spacing:2px;color:#10162f;}
  .title{font-family:'Bricolage Grotesque','Noto Sans SC',sans-serif;font-weight:900;font-size:76px;line-height:1.05;margin:18px 0 8px;color:#10162f;}
  .title_en{font-family:'Space Mono',monospace;font-weight:700;font-size:22px;color:#1565c0;letter-spacing:1px;}
  .desc{font-size:26px;line-height:1.5;color:#222;margin:28px 0 10px;font-weight:500;}
  ul{list-style:none;margin:14px 0;}
  li{font-size:24px;font-weight:700;color:#10162f;padding:12px 0 12px 44px;position:relative;border-bottom:2px dashed rgba(16,22,47,.25);}
  li:before{content:"✓";position:absolute;left:0;top:10px;background:#10162f;color:#FFDE59;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;}
  .price{background:#10162f;color:#FFDE59;border:4px solid #10162f;padding:16px 26px;font-family:'Space Mono',monospace;font-weight:700;}
  .price .now{font-size:52px;line-height:1;} .price .was{font-size:20px;color:#c9c9c9;text-decoration:line-through;}
  .brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:900;font-size:30px;color:#10162f;text-align:right;}
  .brand small{display:block;font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:#1565c0;}
  button{padding:14px 30px;font-size:16px;font-weight:800;background:#10162f;color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;}
</style></head>
<body>
<div id="poster">
  <div class="kicker">JR ACADEMY · 澳洲 IT 求职</div>
  <div class="title">澳洲 IT 简历特训营</div>
  <div class="title_en">IT Resume Bootcamp</div>
  <div class="desc">用招聘官视角重写一份能过 ATS、拿到面试的澳洲 IT 简历</div>
  <ul><li>招聘官 7 秒筛简历的真实标准</li>
<li>Action Verb + Metric + Impact 量化写法</li>
<li>零经验 / 有经验两条专属路线</li>
<li>用 AI 提取 JD 关键词、仿写 bullet point</li></ul>
  <div class="foot">
    <div class="price"><div class="was">原价 $39 AUD</div><div class="now">早鸟 $29</div></div>
    <div class="brand">JR Academy<small>报名即开 · 自主学</small></div>
  </div>
</div>
<button onclick="dl()">⬇ 下载 PNG</button>
<script>
function dl(){html2canvas(document.getElementById('poster'),{scale:2,useCORS:true}).then(c=>{const a=document.createElement('a');a.download='au-it-resume-bootcamp-poster.png';a.href=c.toDataURL('image/png');a.click();});}
</script>
</body></html>
