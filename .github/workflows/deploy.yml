name: Deploy Curriculum to Server

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Setup Chrome + puppeteer-core + 预渲染 mp-article 的所有海报成真实 PNG
      # 让公众号粘贴时能抓到图片 URL（base64 会被微信丢弃）
      - name: Setup Chrome (for mp-article poster PNG rendering)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install curriculum root deps (puppeteer-core)
        run: bun install

      - name: Render mp-article posters to PNG (ai-engineer / business-analyst / web-code)
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bun run render:mp-posters

      # Build ai-adoption-bootcamp
      - name: Build ai-adoption-bootcamp
        working-directory: ai-adoption-bootcamp
        run: |
          bun install
          bun run build

      # Build ai-engineer-bootcamp
      - name: Build ai-engineer-bootcamp
        working-directory: ai-engineer-bootcamp
        run: |
          bun install
          bun run build

      # Build ai-engineer-resume-interview (3h 内部学员讲座 · 42 张 slide · 简历 + 面试)
      # 复用 ai-engineer-bootcamp 的 SlideEngine + theme，含 jd-company-skill-extractor.zip 学员下载
      - name: Build ai-engineer-resume-interview
        working-directory: ai-engineer-resume-interview
        run: |
          bun install
          bun run build

      # Build web-code-bootcamp-or-learn-to-code-1 (第 30 期 Full-Stack + AI · slide deck + mp-article + xhs-posters)
      # URL slug with -1 suffix to match production: /program-course/web-code-bootcamp-or-learn-to-code-1
      - name: Build web-code-bootcamp-or-learn-to-code-1
        working-directory: web-code-bootcamp-or-learn-to-code-1
        run: |
          bun install
          bun run build

      # Build lessons/ai-new-jobs-talk (60-min 公开讲座 · 40 张 slide · AI 催生了哪些新岗位？)
      # 单 slide deck · React+Vite · 跨课复用 lesson 形态 · 数据源 /ai-new-jobs + /career-impact-map
      - name: Build lessons/ai-new-jobs-talk
        working-directory: lessons/ai-new-jobs-talk
        run: |
          bun install
          bun run build

      # Build lessons/ai-marketing-talk (~2h 公开讲座 · 46 张 slide · 新时代的 AI Marketing — 一个人 = 一支营销队伍)
      # 单 slide deck · React+Vite · 跨课复用 lesson 形态 · 导流 ai-programming + ai-solo-founder-bootcamp
      - name: Build lessons/ai-marketing-talk
        working-directory: lessons/ai-marketing-talk
        run: |
          bun install
          bun run build

      # Build lessons/ai-solo-founder-w1 (AI 一人创业营 · W1 · 45 张创业 / SoT / Founder OS 讲课 deck)
      - name: Build lessons/ai-solo-founder-w1
        working-directory: lessons/ai-solo-founder-w1
        run: |
          bun install
          bun run build

      # Build lessons/ai-solo-founder-w2 (AI 一人创业营 · W2 · 35 张 agent 选型 / 权限 / JD / Schedule 讲课 deck)
      - name: Build lessons/ai-solo-founder-w2
        working-directory: lessons/ai-solo-founder-w2
        run: |
          bun install
          bun run build

      # Build lessons/ai-era-neededness (30 张 slide · AI 时代学生的可被需要性)
      - name: Build lessons/ai-era-neededness
        working-directory: lessons/ai-era-neededness
        run: |
          bun install
          bun run build

      # Build lessons/ai-era-neededness-12 (12 张 slide · 精简嘉宾演讲版)
      - name: Build lessons/ai-era-neededness-12
        working-directory: lessons/ai-era-neededness-12
        run: |
          bun install
          bun run build

      # Build lessons/claude-code-master (3h 现场带做 · 61 张 slide · Claude Code 大师课 — SoT/记忆系统/AI OS/ADLC/Skills/动手 Lab)
      - name: Build lessons/claude-code-master
        working-directory: lessons/claude-code-master
        run: |
          bun install
          bun run build

      # Build lessons/claude-code-for-everyone (非技术员工精简版 · 20 张 slide · 什么是 SoT / 怎么跟 AI 交流 / 怎么做记忆)
      - name: Build lessons/claude-code-for-everyone
        working-directory: lessons/claude-code-for-everyone
        run: |
          bun install
          bun run build

      # Build lessons/vibe-coding-master (Vibe Coding 大师课 · 第一节课 · 个人 AI OS + SoT)
      - name: Build lessons/vibe-coding-master
        working-directory: lessons/vibe-coding-master
        run: |
          bun install
          bun run build

      # Build lessons/vibe-coding-master-l2 (Vibe Coding 大师课 · 第二节课 · 产品思维 + PRD + ADLC 工作坊)
      - name: Build lessons/vibe-coding-master-l2
        working-directory: lessons/vibe-coding-master-l2
        run: |
          bun install
          bun run build

      # Build lessons/vibe-coding-master-l3 (Vibe Coding 大师课 · 第三节课 · 用 AI 生成 Design System)
      - name: Build lessons/vibe-coding-master-l3
        working-directory: lessons/vibe-coding-master-l3
        run: |
          bun install
          bun run build

      # Build lessons/vibe-coding-master-l4 (Vibe Coding 大师课 · 第四节课 · 从 PRD 到 Production)
      - name: Build lessons/vibe-coding-master-l4
        working-directory: lessons/vibe-coding-master-l4
        run: |
          bun install
          bun run build

      # Build lessons/vibe-coding-master-l5 (Vibe Coding 大师课 · 第五节课 · Skills — 把套路固化成能力)
      - name: Build lessons/vibe-coding-master-l5
        working-directory: lessons/vibe-coding-master-l5
        run: |
          bun install
          bun run build

      # Build lessons/vibe-coding-master-l6 (Vibe Coding 大师课 · 第六节课 · Agent — 原理与驾驭长任务)
      - name: Build lessons/vibe-coding-master-l6
        working-directory: lessons/vibe-coding-master-l6
        run: |
          bun install
          bun run build

      # Build lessons/ai-solo-founder-w4 (AI 一人创业营 · W4 · 把想法做出来 — 现场跑 Codex)
      - name: Build lessons/ai-solo-founder-w4
        working-directory: lessons/ai-solo-founder-w4
        run: |
          bun install
          bun run build

      # Build lessons/ai-solo-founder-w3 (AI 一人创业营 · W3 · 这是不是一门好生意 — 麦肯锡式商业验证)
      - name: Build lessons/ai-solo-founder-w3
        working-directory: lessons/ai-solo-founder-w3
        run: |
          bun install
          bun run build

      # Build lessons/vibe-coding — Slidev deck (跨课复用 Lesson · Lightman 120 min)
      # Slidev/Vue 在 bun 下偶有 install 问题，沿用 npm 保守
      # base 已写进 package.json: --base /curriculum/lessons/vibe-coding/
      - name: Setup Node (for Slidev)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build lessons/vibe-coding (Slidev)
        working-directory: lessons/vibe-coding
        run: |
          npm install --no-audit --no-fund
          npm run build

      # ai-essentials-bootcamp: static HTML only, no React build needed

      # ai-programming (Cursor AI 编程实战课): static HTML only, no React build needed

      # ai-builder (Vibe Coding 大师课): static HTML only, no React build needed

      # Assemble all courses into one output
      - name: Assemble output
        run: |
          mkdir -p _site/ai-adoption-bootcamp
          cp -r ai-adoption-bootcamp/dist/* _site/ai-adoption-bootcamp/
          cp ai-adoption-bootcamp/public/index.html _site/ai-adoption-bootcamp/
          cp ai-adoption-bootcamp/public/curriculum.html _site/ai-adoption-bootcamp/
          cp ai-adoption-bootcamp/public/phase1.html _site/ai-adoption-bootcamp/
          cp ai-adoption-bootcamp/public/phase2.html _site/ai-adoption-bootcamp/
          cp ai-adoption-bootcamp/public/phase3.html _site/ai-adoption-bootcamp/
          cp ai-adoption-bootcamp/public/phase4.html _site/ai-adoption-bootcamp/
          cp ai-adoption-bootcamp/public/styles.css _site/ai-adoption-bootcamp/
          cp ai-adoption-bootcamp/public/internal.html _site/ai-adoption-bootcamp/
          cp ai-adoption-bootcamp/public/learning-plan.html _site/ai-adoption-bootcamp/
          [ -f ai-adoption-bootcamp/public/pages.json ] && cp ai-adoption-bootcamp/public/pages.json _site/ai-adoption-bootcamp/ || true
          # ai-adoption-bootcamp 小红书素材集
          if [ -d ai-adoption-bootcamp/public/xhs-posters ]; then
            cp -r ai-adoption-bootcamp/public/xhs-posters _site/ai-adoption-bootcamp/
          fi

          mkdir -p _site/ai-essentials-bootcamp
          cp -r ai-essentials-bootcamp/public/* _site/ai-essentials-bootcamp/

          # web-code-bootcamp-or-learn-to-code-1 (第 30 期 · Full-Stack + AI)
          # URL slug 匹配 production: /program-course/web-code-bootcamp-or-learn-to-code-1
          # 包含：Vite slide deck（dist）+ curriculum.html + styles.css
          #       + mp-article 公众号发稿页 + xhs-posters 小红书素材 + outline.json
          mkdir -p _site/web-code-bootcamp-or-learn-to-code-1
          cp -r web-code-bootcamp-or-learn-to-code-1/dist/* _site/web-code-bootcamp-or-learn-to-code-1/
          if [ -d web-code-bootcamp-or-learn-to-code-1/public ]; then
            cp -r web-code-bootcamp-or-learn-to-code-1/public/* _site/web-code-bootcamp-or-learn-to-code-1/
          fi

          # ai-engineer-rag (AI Engineer 入门): static HTML only, no React build needed
          if [ -d ai-engineer-rag/public ]; then
            mkdir -p _site/ai-engineer-rag
            cp -r ai-engineer-rag/public/* _site/ai-engineer-rag/
          fi

          # data-engineer-data-analyst (机器学习 & 数据工程全栈项目班 · 改版 · 10 周 · 视频课 + 单一项目全程带练): static HTML only
          if [ -d data-engineer-data-analyst/public ]; then
            mkdir -p _site/data-engineer-data-analyst
            cp -r data-engineer-data-analyst/public/* _site/data-engineer-data-analyst/
          fi

          # ai-programming (Cursor AI 编程实战课) / ai-builder (Vibe Coding 大师课):
          # only copy if directory exists (not yet committed)
          if [ -d ai-programming/public ]; then
            mkdir -p _site/ai-programming
            cp -r ai-programming/public/* _site/ai-programming/
          fi

          if [ -d ai-builder/public ]; then
            mkdir -p _site/ai-builder
            cp -r ai-builder/public/* _site/ai-builder/
          fi

          # full-stack-developer-interview: data-only (outline.json used by skills-data sync),
          # HTML pages will land later. Deployed so outline.json + any future pages are live.
          if [ -d full-stack-developer-interview/public ]; then
            mkdir -p _site/full-stack-developer-interview
            cp -r full-stack-developer-interview/public/* _site/full-stack-developer-interview/
          fi

          # it-career-support: static HTML only
          if [ -d it-career-support/public ]; then
            mkdir -p _site/it-career-support
            cp -r it-career-support/public/* _site/it-career-support/
          fi

          # openclaw-workshop: static HTML only (4-hour offline workshop, no React build)
          if [ -d openclaw-workshop/public ]; then
            mkdir -p _site/openclaw-workshop
            cp -r openclaw-workshop/public/* _site/openclaw-workshop/
          fi

          # openclaw-fullday-workshop: static HTML only (8-hour SMB owner fullday version of openclaw-workshop)
          if [ -d openclaw-fullday-workshop/public ]; then
            mkdir -p _site/openclaw-fullday-workshop
            cp -r openclaw-fullday-workshop/public/* _site/openclaw-fullday-workshop/
          fi

          # claude-code-workshop: static HTML only (3h Zoom 工程师友好版, Claude Code CLI 实战)
          if [ -d claude-code-workshop/public ]; then
            mkdir -p _site/claude-code-workshop
            cp -r claude-code-workshop/public/* _site/claude-code-workshop/
          fi

          # claude-code-workshop-fullday: static HTML only (1day 线下非技术友好版, Claude Code CLI)
          if [ -d claude-code-workshop-fullday/public ]; then
            mkdir -p _site/claude-code-workshop-fullday
            cp -r claude-code-workshop-fullday/public/* _site/claude-code-workshop-fullday/
          fi

          # ai-comic-workshop: static HTML only (2-hour online Zoom workshop, 张彦伟 · AI 漫剧)
          if [ -d ai-comic-workshop/public ]; then
            mkdir -p _site/ai-comic-workshop
            cp -r ai-comic-workshop/public/* _site/ai-comic-workshop/
          fi

          # ai-comic-video-course: static HTML only (15-lesson video-on-demand course, 张彦伟 · AI 漫剧 入门班 15 节 · JR Academy 独家)
          if [ -d ai-comic-video-course/public ]; then
            mkdir -p _site/ai-comic-video-course
            cp -r ai-comic-video-course/public/* _site/ai-comic-video-course/
          fi

          # ai-comic-bootcamp: static HTML only (11 章 49 节进阶班 + 课程体系 hub, 张彦伟 · AI 漫剧)
          if [ -d ai-comic-bootcamp/public ]; then
            mkdir -p _site/ai-comic-bootcamp
            cp -r ai-comic-bootcamp/public/* _site/ai-comic-bootcamp/
          fi

          # ai-comic-drama-camp: static HTML only (12 节直播实战营, 朱依晨 · 小红书『千立AI艺术教室』· curriculum + 4 phase)
          if [ -d ai-comic-drama-camp/public ]; then
            mkdir -p _site/ai-comic-drama-camp
            cp -r ai-comic-drama-camp/public/* _site/ai-comic-drama-camp/
          fi

          # ai-image-text-workshop: static HTML only (2.5-hour online Zoom workshop, 小红书图文号起号实操课)
          if [ -d ai-image-text-workshop/public ]; then
            mkdir -p _site/ai-image-text-workshop
            cp -r ai-image-text-workshop/public/* _site/ai-image-text-workshop/
          fi

          # claude-cowork-workshop: static HTML only (3-hour hands-on workshop, Claude Cowork)
          if [ -d claude-cowork-workshop/public ]; then
            mkdir -p _site/claude-cowork-workshop
            cp -r claude-cowork-workshop/public/* _site/claude-cowork-workshop/
          fi

          # claude-cowork-sme-workshop: static HTML only (4-hour paid workshop, Brisbane · 小老板 + 自由职业者 SME 版)
          if [ -d claude-cowork-sme-workshop/public ]; then
            mkdir -p _site/claude-cowork-sme-workshop
            cp -r claude-cowork-sme-workshop/public/* _site/claude-cowork-sme-workshop/
          fi

          # ai-adoption-workshop: static HTML only (2-hour free Zoom webinar · AI Adoption Specialist 入门工作坊 · 引流 Bootcamp)
          if [ -d ai-adoption-workshop/public ]; then
            mkdir -p _site/ai-adoption-workshop
            cp -r ai-adoption-workshop/public/* _site/ai-adoption-workshop/
          fi

          # agile-ai-workshop: static HTML only (3-hour online Workshop · 企业决策层版 · Mini-Bootcamp 第一节 · 引出 Human Agility)
          if [ -d agile-ai-workshop/public ]; then
            mkdir -p _site/agile-ai-workshop
            cp -r agile-ai-workshop/public/* _site/agile-ai-workshop/
          fi

          # omnichannel-marketing-workshop: static HTML only (1-day in-person workshop, KL · AI 营销全渠道)
          if [ -d omnichannel-marketing-workshop/public ]; then
            mkdir -p _site/omnichannel-marketing-workshop
            cp -r omnichannel-marketing-workshop/public/* _site/omnichannel-marketing-workshop/
          fi

          # ai-accounting-workshop: static HTML only (4-hour 引流课 · 协会 co-host · AI 教练主讲 · 含 AU 数据准备指南)
          if [ -d ai-accounting-workshop/public ]; then
            mkdir -p _site/ai-accounting-workshop
            cp -r ai-accounting-workshop/public/* _site/ai-accounting-workshop/
          fi

          # gp-program-workshop: static HTML only (3-hour online Zoom workshop, 澳洲校招 Graduate Program 申请实战 · 留学生)
          if [ -d gp-program-workshop/public ]; then
            mkdir -p _site/gp-program-workshop
            cp -r gp-program-workshop/public/* _site/gp-program-workshop/
          fi

          # china-campus-workshop: static HTML only (3-hour Zoom workshop, 留学生回国校招冲刺 · Steven Yu 主讲 · 49 元)
          if [ -d china-campus-workshop/public ]; then
            mkdir -p _site/china-campus-workshop
            cp -r china-campus-workshop/public/* _site/china-campus-workshop/
          fi

          # china-career: 留学生回国就业产品线 Hub (11 SKU 一站式入口 · PRD_CHINA_CAREER_HUB_2026.md)
          if [ -d china-career ]; then
            mkdir -p _site/china-career
            cp -r china-career/* _site/china-career/
          fi

          # ai-accounting-pro: static HTML only (12-hour 主课 · 6 周 cohort · 10-12 人小班 · $1,799-$2,299 AUD · 引流课的转化主课)
          if [ -d ai-accounting-pro/public ]; then
            mkdir -p _site/ai-accounting-pro
            cp -r ai-accounting-pro/public/* _site/ai-accounting-pro/
          fi

          # techscrum-devops: static HTML only (DevOps 小班课 · 三阶定价 · $990 / $3,550 / $5,350 AUD · 8 次直播陪跑 Dispatch AI 项目 + AWS K8s 特训营)
          if [ -d techscrum-devops/public ]; then
            mkdir -p _site/techscrum-devops
            cp -r techscrum-devops/public/* _site/techscrum-devops/
          fi

          # ai-engineer-cn: static HTML only (AI Engineer 训练营 国内版 · 12 周 · 边学边做 Dispatch AI · RAG/Agent/MCP/私有化部署 · 对齐国内大模型应用开发岗 JD)
          if [ -d ai-engineer-cn/public ]; then
            mkdir -p _site/ai-engineer-cn
            cp -r ai-engineer-cn/public/* _site/ai-engineer-cn/
          fi

          # openclaw-bootcamp: static HTML only (4-week deep version of openclaw-workshop)
          if [ -d openclaw-bootcamp/public ]; then
            mkdir -p _site/openclaw-bootcamp
            cp -r openclaw-bootcamp/public/* _site/openclaw-bootcamp/
          fi

          # ai-solo-founder-bootcamp: static HTML only (11-week 三城线下 AI 一人创业营，AU 专属)
          if [ -d ai-solo-founder-bootcamp/public ]; then
            mkdir -p _site/ai-solo-founder-bootcamp
            cp -r ai-solo-founder-bootcamp/public/* _site/ai-solo-founder-bootcamp/
          fi

          # ai-marketing: static HTML only (4-week AI 营销全链路 · 64 节 · 4 Phase · 含 4 节 ¥99 引流课)
          if [ -d ai-marketing/public ]; then
            mkdir -p _site/ai-marketing
            cp -r ai-marketing/public/* _site/ai-marketing/
          fi

          # business-analyst (AI 产品经理 BA 训练营): static HTML only, generated from outline.json
          if [ -d business-analyst/public ]; then
            mkdir -p _site/business-analyst
            cp -r business-analyst/public/* _site/business-analyst/
          fi

          # cca-f-cert-pack (Claude 官方架构师认证 · 考试直通包): static HTML only
          if [ -d cca-f-cert-pack/public ]; then
            mkdir -p _site/cca-f-cert-pack
            cp -r cca-f-cert-pack/public/* _site/cca-f-cert-pack/
          fi

          # ccao-f-cert-pack (Claude 官方 Associate 认证 · 考试直通包): static HTML only
          if [ -d ccao-f-cert-pack/public ]; then
            mkdir -p _site/ccao-f-cert-pack
            cp -r ccao-f-cert-pack/public/* _site/ccao-f-cert-pack/
          fi

          # ccdv-f-cert-pack (Claude 官方开发者认证 · 考试直通包): static HTML only
          if [ -d ccdv-f-cert-pack/public ]; then
            mkdir -p _site/ccdv-f-cert-pack
            cp -r ccdv-f-cert-pack/public/* _site/ccdv-f-cert-pack/
          fi

          # ccar-p-cert-pack (Claude 官方架构师认证 Professional · 考试直通包): static HTML only
          if [ -d ccar-p-cert-pack/public ]; then
            mkdir -p _site/ccar-p-cert-pack
            cp -r ccar-p-cert-pack/public/* _site/ccar-p-cert-pack/
          fi

          # cca-f-claude-code-bootcamp (Claude 架构师认证 · Claude Code 实战冲刺班 · CCA-F 名额 + Claude Code 真实环境实战): static HTML only
          if [ -d cca-f-claude-code-bootcamp/public ]; then
            mkdir -p _site/cca-f-claude-code-bootcamp
            cp -r cca-f-claude-code-bootcamp/public/* _site/cca-f-claude-code-bootcamp/
          fi

          # lessons/ai-new-jobs-talk: 60-min 公开讲座 slide deck (React + Vite · 40 张 slide)
          # 跨课复用 lesson · 数据源 jiangren.com.au/ai-new-jobs + /career-impact-map
          # Vite build 已 copy public/ 到 dist/，outline.json 也在 dist 里
          if [ -d lessons/ai-new-jobs-talk/dist ]; then
            mkdir -p _site/lessons/ai-new-jobs-talk
            cp -r lessons/ai-new-jobs-talk/dist/* _site/lessons/ai-new-jobs-talk/
          fi

          # lessons/ai-new-jobs-talk/xhs: 小红书改编系列（6 主稿 + case-T01 演示 + 116 选题池）
          # 纯静态 HTML，跳过 Vite，直接 copy
          if [ -d lessons/ai-new-jobs-talk/xhs ]; then
            mkdir -p _site/lessons/ai-new-jobs-talk/xhs
            cp -r lessons/ai-new-jobs-talk/xhs/* _site/lessons/ai-new-jobs-talk/xhs/
          fi

          # lessons/ai-marketing-talk: ~2h 公开讲座 slide deck (React + Vite · 46 张 slide)
          # 跨课复用 lesson · 主题色 #E63977 · 导流 ai-programming + ai-solo-founder-bootcamp
          if [ -d lessons/ai-marketing-talk/dist ]; then
            mkdir -p _site/lessons/ai-marketing-talk
            cp -r lessons/ai-marketing-talk/dist/* _site/lessons/ai-marketing-talk/
          fi

          # AI 一人创业营 W1 · 搭起你的 CEO AI OS
