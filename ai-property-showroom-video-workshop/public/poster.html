ottom{position:absolute;left:84px;right:84px;bottom:72px;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #ffffff44;padding-top:28px}.bottom b{font-size:25px}.bottom span{display:block;color:#cbd1cc;font-size:18px;margin-top:7px}.disclaimer{max-width:460px;text-align:right;font-size:15px;color:#b8c0ba;line-height:1.5}.download{position:fixed;right:24px;bottom:24px;border:0;background:#f4ce81;color:#17211c;padding:14px 20px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:5px 5px 0 #17211c}@media(max-width:900px){body{padding:10px}.poster{transform-origin:top center;transform:scale(.55);margin-bottom:-747px}}@media(max-width:560px){.poster{transform:scale(.3);margin-bottom:-1160px}}</style></head><body><div class="poster" id="poster"><div class="top"><div class="brand">JIANGREN ACADEMY</div><div class="badge">150分钟 · 线上直播带做</div></div><div class="eyebrow">AI × 房地产空间营销</div><h1>把期房素材<br>变成样板间视频</h1><div class="sub">从户型图、效果图或毛坯照片出发，完成空间视觉、镜头运动、讲解文案、配音、字幕和成片。</div><div class="flow"><div><b>01 空间生成</b>保持结构与风格一致</div><div><b>02 稳定运镜</b>推进 · 横移 · 轻环绕</div><div><b>03 声画成片</b>文案 · 配音 · 字幕</div></div><div class="result"><small>下课交付</small><strong>一条 15～30 秒<br>期房样板间展示视频</strong></div><div class="bottom"><div><b>适合：房地产营销 · 置业顾问<br>房产中介 · 室内设计公司</b><span>零基础可参加 · 自备一份项目素材</span></div><div class="disclaimer">本课程演示内容含AI生成，仅作效果示意。对外使用应明确标注，不代表实际建成或最终交付效果。</div></div></div><button class="download" onclick="savePoster()">⬇ 下载 PNG</button><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>async function savePoster(){const btn=document.querySelector('.download');btn.textContent='生成中…';const c=await html2canvas(document.getElementById('poster'),{scale:1,useCORS:true,backgroundColor:'#17211c'});const a=document.createElement('a');a.download='AI期房样板间视频实战工作坊.png';a.href=c.toDataURL('image/png');a.click();btn.textContent='⬇ 下载 PNG'}</script></body></html>
